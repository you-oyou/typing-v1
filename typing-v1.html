<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英打練習版本一</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #30251f;
    font-family: "Noto Sans TC", sans-serif;
    color: #38261d;
}

/* 復古外框 */
.machine {
    width: min(900px, 92vw);
    padding: 18px;
    background: #704a32;
    border: 7px solid #211813;
    border-radius: 24px;
    box-shadow:
        0 25px 60px rgba(0,0,0,.55),
        inset 0 0 0 3px #a6754d;
}

/* 主畫面 */
.screen {
    position: relative;
    min-height: 600px;
    padding: 60px 30px;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: #f5e5b9;
    border: 5px solid #211813;
    border-radius: 12px;
}

/* 復古掃描線 */
.screen::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        0deg,
        rgba(80,50,30,.025) 0px,
        rgba(80,50,30,.025) 2px,
        transparent 2px,
        transparent 6px
    );
}

/* 裝飾花 */
.flower {
    position: absolute;
    color: #d66a32;
    font-size: 42px;
    opacity: .85;
}

.flower.one {
    top: 55px;
    left: 70px;
}

.flower.two {
    top: 80px;
    right: 75px;
}

.flower.three {
    bottom: 55px;
    left: 100px;
}

.flower.four {
    bottom: 60px;
    right: 95px;
}

/* 小標籤 */
.badge {
    position: relative;
    padding: 10px 18px;
    color: #fff3cf;
    background: #d66a32;
    border: 3px solid #38261d;
    box-shadow: 5px 5px 0 #38261d;
    font-weight: 900;
    letter-spacing: 3px;
    transform: rotate(-2deg);
}

/* 標題 */
h1 {
    position: relative;
    margin: 35px 0 10px;

    font-family: "Press Start 2P", monospace;
    font-size: clamp(28px, 5vw, 50px);
    line-height: 1.5;

    color: #38261d;
    text-shadow: 4px 4px 0 #d6bd80;
}

.subtitle {
    position: relative;
    margin: 0 0 35px;

    font-size: 17px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #6b4932;
}

/* 鍵盤 */
.keyboard {
    position: relative;
    width: min(560px, 88%);
    padding: 18px;

    background: #b98b5a;
    border: 4px solid #38261d;
    border-radius: 12px;

    box-shadow: 8px 8px 0 #38261d;
}

.keys {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 7px;
}

.key {
    aspect-ratio: 1.35;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f2dfb1;
    border: 2px solid #38261d;
    border-radius: 5px;

    font-family: monospace;
    font-weight: 900;
    font-size: 13px;

    box-shadow: 0 3px 0 #694936;
}

.key:nth-child(3n) {
    background: #e7c987;
}

/* 開始按鈕 */
.start-button {
    position: relative;
    margin-top: 38px;

    padding: 17px 48px;

    color: white;
    background: #d66a32;

    border: 4px solid #38261d;
    border-radius: 8px;

    font-family: "Noto Sans TC", sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;

    cursor: pointer;

    box-shadow: 7px 7px 0 #38261d;
    transition: .12s ease;
}

.start-button:hover {
    transform: translate(3px, 3px);
    box-shadow: 4px 4px 0 #38261d;
    filter: brightness(1.08);
}

.start-button:active {
    transform: translate(7px, 7px);
    box-shadow: 0 0 #38261d;
}

/* 底部文字 */
.footer {
    position: relative;
    margin-top: 27px;

    font-size: 11px;
    letter-spacing: 2px;
    opacity: .6;
}

/* 手機版 */
@media (max-width: 600px) {
    .machine {
        padding: 10px;
        border-width: 5px;
    }

    .screen {
        min-height: 600px;
        padding: 40px 18px;
    }

    .keyboard {
        width: 94%;
        padding: 10px;
    }

    .keys {
        gap: 3px;
    }

    .key {
        font-size: 8px;
    }

    .flower {
        font-size: 25px;
    }

    .flower.one { left: 25px; }
    .flower.two { right: 25px; }
    .flower.three { left: 35px; }
    .flower.four { right: 35px; }
}
</style>
</head>

<body>

<div class="machine">

    <main class="screen">

        <div class="flower one">✿</div>
        <div class="flower two">✦</div>
        <div class="flower three">✽</div>
        <div class="flower four">❀</div>

        <div class="badge">
            TYPEWRITER CLUB · 001
        </div>

        <h1>
            英打練習<br>
            版本一
        </h1>

        <div class="subtitle">
            ENGLISH TYPING PRACTICE
        </div>

        <!-- 復古鍵盤 -->
        <div class="keyboard">
            <div class="keys" id="keys"></div>
        </div>

        <!-- 目前只有按鈕，不會進入下一頁 -->
        <button class="start-button">
            開始遊戲　▶
        </button>

        <div class="footer">
            EST. 1987　·　KEEP CALM &amp; KEEP TYPING
        </div>

    </main>

</div>

<script>
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const keyboard = document.getElementById("keys");

letters.split("").forEach(letter => {
    const key = document.createElement("div");
    key.className = "key";
    key.textContent = letter;
    keyboard.appendChild(key);
});
</script>

</body>
</html>
